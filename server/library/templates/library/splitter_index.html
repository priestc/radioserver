<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Splitter</title>
<style>
  :root {
    --bg: #0c0c0e; --bg-elevated: #161618; --bg-hover: #232326; --border: #2a2a2e;
    --text: #f2f2f3; --text-dim: #9a9a9e; --accent: #1db954; --warn: #e0a100;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: var(--text-dim); margin: 0 0 20px; }
  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .filters button {
    background: var(--bg-elevated); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 16px; padding: 5px 12px; font: inherit; cursor: pointer;
  }
  .filters button.active { color: var(--text); border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  tr:hover td { background: var(--bg-elevated); }
  a { color: var(--text); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .badge.pending { background: #2b2b10; color: var(--warn); }
  .badge.done { background: #10301b; color: var(--accent); }
  .notes { color: var(--text-dim); font-size: 12.5px; }
  .empty { color: var(--text-dim); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Track Splitter</h1>
  <p class="sub">Long recordings waiting to be cut into separate tracks. Episodes with review notes had song boundaries the auto-splitter wasn't sure about.</p>
  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="review">Needs review</button>
    <button data-filter="pending">Not imported</button>
    <button data-filter="done">Imported</button>
  </div>
  <table>
    <thead><tr><th>Recording</th><th>Tracks</th><th>Status</th><th>Review notes</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" hidden>No recordings match this filter.</div>
</main>
{{ jobs|json_script:"jobs-data" }}
<script>
  const jobs = JSON.parse(document.getElementById("jobs-data").textContent);
  const rows = document.getElementById("rows");
  function render(filter) {
    rows.innerHTML = "";
    const shown = jobs.filter(j =>
      filter === "all" || (filter === "review" ? j.review_notes && j.status !== "done" : j.status === filter));
    for (const j of shown) {
      const tr = document.createElement("tr");
      const name = document.createElement("td");
      const a = document.createElement("a");
      a.href = `/library/splitter/${j.id}/`;
      a.textContent = j.album_title;
      name.append(a);
      const count = document.createElement("td");
      count.textContent = j.track_count;
      const status = document.createElement("td");
      status.innerHTML = `<span class="badge ${j.status}">${j.status === "done" ? "Imported" : "Not imported"}</span>`;
      const notes = document.createElement("td");
      notes.className = "notes";
      notes.textContent = j.review_notes;
      tr.append(name, count, status, notes);
      rows.append(tr);
    }
    document.getElementById("empty").hidden = shown.length > 0;
  }
  document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".filters button").forEach(x => x.classList.toggle("active", x === b));
    render(b.dataset.filter);
  }));
  render("all");
</script>
</body>
</html>
